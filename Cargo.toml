[package]
name = "uaf"
version = "0.1.0"
edition = "2021"
description = "Universal Agent Framework MVP CLI"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
